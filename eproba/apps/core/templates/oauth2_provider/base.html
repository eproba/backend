<!DOCTYPE html>
<html lang="pl">
{% load static %}
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <meta content="noindex, nofollow" name="robots">
    <meta content="#eef2f3" name="theme-color">
    <title>{% block title %}Autoryzacja OAuth — Epróba{% endblock %}</title>
    <link href="{% static 'images/icons/favicon.svg' %}" rel="icon" type="image/svg+xml">
    <link href="{% static 'css/oauth.css' %}" rel="stylesheet">
</head>
<body>
<main class="oauth-shell">
    <div class="oauth-layout">
        {% block oauth_content %}{% endblock %}
    </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
{% load static %}
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>
        {% if dev_mode %}DEV - {% endif %}{% block title %}Epróba{% endblock %}
    </title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link href="{% static 'css/stylesheet.css' %}" rel="stylesheet" type="text/css">
    <link
            rel="icon"
            href="{% static 'images/icons/favicon.svg' %}"
            type="image/svg+xml"
    />
    <script
            async
            src="https://kit.fontawesome.com/a00f1140b1.js"
            crossorigin="anonymous"
    ></script>
    <script src="https://accounts.google.com/gsi/client" async></script>
    <script>
        const csrfToken = "{{ csrf_token }}";
    </script>
    {% block extrahead %} {% endblock %}
</head>
<body>
{% if not request.user.is_authenticated and google_auth_enabled %}
    <div
            id="g_id_onload"
            data-client_id="897419344971-f2uj5udmpk698ur529di5ens7ufogclg.apps.googleusercontent.com"
            data-context="use"
            data-ux_mode="redirect"
            data-login_uri="{% if request.is_secure %}https://{{ request.get_host }}{% endif %}{% url 'google_auth_receiver' %}"
            data-state="{{ request.get_full_path }}"
            data-itp_support="true"
    ></div>
{% endif %}
<div
        class="container"
        style="min-height: 100vh; display: flex; flex-direction: column"
>
    {% block content %} {% endblock %}
</div>
</body>
</html>
